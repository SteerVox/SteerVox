name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should SteerVox do?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and safety considerations
      description: Mention transcript, clipboard, screen, local file, automation, or provider implications.
