packs:
- id: medical
  label: Medical / Clinical Documentation
  description: Documentation-focused terminology, templates, and examples for clinical
    notes, handoffs, and visit summaries.
  documentation_only: true
  default_intent: clinical_note_draft
  glossary:
  - term: BP
    aliases:
    - bp
    - b p
    kind: abbreviation
    priority: 100
  - term: HR
    aliases:
    - hr
    - h r
    kind: abbreviation
    priority: 100
  - term: SOB
    aliases:
    - sob
    - s o b
    kind: abbreviation
    priority: 90
  - term: PRN
    aliases:
    - prn
    - p r n
    kind: abbreviation
    priority: 90
  - term: BID
    aliases:
    - bid
    - b i d
    kind: abbreviation
    priority: 90
  - term: TID
    aliases:
    - tid
    - t i d
    kind: abbreviation
    priority: 90
  - term: HPI
    aliases:
    - hpi
    - h p i
    kind: abbreviation
    priority: 100
  - term: ROS
    aliases:
    - ros
    - r o s
    kind: abbreviation
    priority: 100
  - term: Dx
    aliases:
    - dx
    - d x
    kind: abbreviation
    priority: 90
  - term: Rx
    aliases:
    - rx
    - r x
    kind: abbreviation
    priority: 90
  - term: follow-up
    aliases:
    - follow up
    kind: phrase
    priority: 70
  - term: care team
    aliases:
    - careteam
    kind: phrase
    priority: 60
  templates:
  - id: clinical_note_template
    label: Clinical note draft
    intent: clinical_note_draft
    body: Use a structured note with short sections such as HPI, assessment details
      already stated by the user, and plan or follow-up items. Keep it documentation-focused
      and do not add medical judgment that was not spoken.
    priority: 100
  - id: handoff_template
    label: Referral or handoff note
    intent: referral_handoff_note
    body: Summarize the handoff reason, current status, key documentation points,
      and next action for the receiving team. Keep it concise and section-based.
    priority: 100
  - id: visit_summary_template
    label: Discharge or visit summary
    intent: discharge_visit_summary
    body: Use short sections for visit reason, major events, instructions already
      given, and follow-up. Keep the wording clear and patient-safe without adding
      diagnosis or treatment advice.
    priority: 95
  examples:
  - id: clinical_note_example
    label: Clinical note example
    intent: clinical_note_draft
    output: 'HPI: Patient reports worsening shortness of breath over the last two
      days with intermittent cough.

      Assessment details: BP and HR reviewed. Symptoms reviewed with the care team.

      Follow-up: Return precautions and follow-up timing were discussed.'
    priority: 100
  - id: handoff_note_example
    label: Handoff note example
    intent: referral_handoff_note
    output: 'Referral summary: sending for specialist follow-up after ongoing symptoms.

      Current status: recent visit completed and notes updated.

      Next step: receiving team to review documentation and schedule follow-up.'
    priority: 90
  styles:
    tone: concise, structured, documentation-first
    safety_note: do not add diagnosis or treatment recommendations
    format: short sections, high signal, review-friendly
    preferred_llm_provider: lmstudio
    preferred_llm_model_pattern: medgemma
  controls:
    default_format: paragraph
    default_surface_behavior: note
    suppress_external_text: true
    minimize_context_capture: true
    tone: structured documentation
    audience: clinical documentation teams
- id: shipping
  label: Shipping / Logistics
  description: Templates, glossary terms, and examples for freight, dispatch, warehouse,
    and customer shipment updates.
  documentation_only: false
  default_intent: shipment_update
  glossary:
  - term: ETA
    aliases:
    - eta
    - e t a
    kind: acronym
    priority: 100
  - term: ETD
    aliases:
    - etd
    - e t d
    kind: acronym
    priority: 100
  - term: POD
    aliases:
    - pod
    - p o d
    kind: acronym
    priority: 90
  - term: ASN
    aliases:
    - asn
    - a s n
    kind: acronym
    priority: 90
  - term: BOL
    aliases:
    - bol
    - b o l
    - bill of lading
    kind: acronym
    priority: 100
  - term: FCL
    aliases:
    - fcl
    - f c l
    kind: acronym
    priority: 90
  - term: LCL
    aliases:
    - lcl
    - l c l
    kind: acronym
    priority: 90
  - term: AWB
    aliases:
    - awb
    - a w b
    - air waybill
    kind: acronym
    priority: 90
  - term: FOB
    aliases:
    - fob
    - f o b
    kind: acronym
    priority: 80
  - term: CIF
    aliases:
    - cif
    - c i f
    kind: acronym
    priority: 80
  - term: container number
    aliases:
    - container no
    - container ref
    kind: reference
    priority: 70
  - term: shipment ID
    aliases:
    - shipment id
    - shipment reference
    kind: reference
    priority: 70
  templates:
  - id: shipment_update_email
    label: Shipment update
    intent: shipment_update
    body: Start with the shipment status, then note location, next milestone, ETA
      or ETD, and any blocker. Keep it concise and customer-friendly.
    priority: 100
  - id: delay_notification_email
    label: Delay notification
    intent: delay_notification
    body: State the delay clearly, explain the operational reason without over-speculating,
      give the updated ETA when available, and close with the next step or follow-up
      time.
    priority: 100
  - id: operations_handoff_note
    label: Operations handoff
    intent: operations_note
    body: Use short bullets for issue, current status, next action, owner, and timing.
      Prefer operational shorthand over prose.
    priority: 90
  - id: exception_summary
    label: Incident summary
    intent: incident_exception_summary
    body: Summarize the exception, the impact, what has already been checked, and
      the next action. Keep it direct and structured.
    priority: 90
  examples:
  - id: delay_notification_example
    label: Delay notification example
    intent: delay_notification
    output: 'Shipment update: the container is running behind the original ETA due
      to port congestion. The revised ETA is tomorrow evening. We are monitoring the
      vessel closely and will send the next update once discharge is confirmed.'
    priority: 100
  - id: operations_note_example
    label: Operations note example
    intent: operations_note
    output: '- Shipment held at customs for document review

      - Broker requested corrected BOL reference

      - Ops team sent updated paperwork

      - Recheck status at 16:00 local'
    priority: 90
  styles:
    tone: concise, operational, direct
    customer_voice: clear and reassuring without sounding defensive
    internal_voice: short, structured, handoff-ready
  controls:
    default_format: auto
    default_surface_behavior: auto
    suppress_external_text: false
    minimize_context_capture: false
    tone: concise operational
    audience: customers and operations teams
